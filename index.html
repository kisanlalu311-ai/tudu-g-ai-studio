
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17152f">
<title>Tudu G AI Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#111126;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:22px 16px;
 background:linear-gradient(120deg,#5429b8,#244bd5);
 text-align:center;
}
header h1{margin:0;font-size:25px}
header p{margin:8px 0 0;color:#e3dcff}
main{max-width:650px;margin:auto;padding:18px}
.card{
 background:#201f40;border:1px solid #38365f;
 padding:17px;border-radius:17px;margin-bottom:17px;
}
h2{font-size:19px;margin:0 0 13px}
label{display:block;margin:12px 0 7px}
textarea,input,select{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid #555078;background:#14142b;
 color:white;font-size:15px;
}
textarea{min-height:145px;resize:vertical}
button{
 border:0;border-radius:12px;padding:14px;
 background:#6251ed;color:white;font-size:16px;
 font-weight:bold;width:100%;margin-top:13px;
}
button:active{opacity:.8}
.secondary{background:#38365c}
.scene{
 background:#29264c;border-radius:12px;
 padding:14px;margin-top:12px;
 border:1px solid #494477;
}
.scene h3{color:#b9aaff;margin:0 0 10px}
.small{color:#c1bfd6;font-size:13px}
.tag{
 display:inline-block;background:#393263;
 padding:5px 9px;border-radius:20px;
 font-size:12px;margin:3px;
}
footer{text-align:center;color:#aaa;padding:20px;font-size:12px}
</style>
</head>
<body>
<header>
 <h1>🎬 Tudu G AI Studio</h1>
 <p>अपनी कहानी को कार्टून स्टोरीबोर्ड में बदलें</p>
</header>

<main>
 <section class="card">
  <h2>✨ नई कार्टून कहानी</h2>
  <label>अपनी कहानी लिखिए</label>
  <textarea id="story" placeholder="यहाँ अपनी हिंदी कहानी लिखें..."></textarea>

  <label>वीडियो फॉर्मेट</label>
  <select id="format">
   <option>16:9 Landscape</option>
   <option>9:16 Portrait</option>
  </select>

  <label>कहानी के सीन</label>
  <select id="count">
   <option value="4">4 सीन</option>
   <option value="8">8 सीन</option>
   <option value="12">12 सीन</option>
  </select>

  <button onclick="makeScenes()">🚀 Create My Cartoon</button>
 </section>

 <section class="card">
  <h2>🎨 Character Style</h2>
  <span class="tag">3D Cartoon</span>
  <span class="tag">Colorful</span>
  <span class="tag">Kids Friendly</span>
  <p class="small">एक जैसे किरदार और रंगीन कार्टून सीन के लिए निर्देश।</p>
 </section>

 <section class="card" id="result" style="display:none">
  <h2>📽️ आपका Storyboard</h2>
  <div id="scenes"></div>
  <button class="secondary" onclick="copyPrompts()">📋 Copy All Image Prompts</button>
 </section>
</main>

<footer>Made with ❤️ by Tudu G Official</footer>

<script>
let prompts=[];

function makeScenes(){
 const story=document.getElementById("story").value.trim();
 if(!story){
  alert("पहले अपनी कहानी लिखिए!");
  return;
 }

 const count=Number(document.getElementById("count").value);
 const format=document.getElementById("format").value;
 const sentences=story.split(/[।.!?]+/).map(s=>s.trim()).filter(Boolean);

 const scenes=[];
 for(let i=0;i<count;i++){
  let text=sentences.length
   ? sentences[Math.min(sentences.length-1,Math.floor(i*sentences.length/count))]
   : story;

  scenes.push({
   number:i+1,
   text:text,
   prompt:"Premium colorful 3D cartoon animation, "+text+
   ", consistent characters, expressive faces, beautiful cinematic lighting, child friendly, "+format
  });
 }

 prompts=scenes.map(s=>"Scene "+s.number+": "+s.prompt);

 document.getElementById("scenes").innerHTML=scenes.map(s=>`
  <div class="scene">
   <h3>Scene ${s.number}</h3>
   <p>${escapeHTML(s.text)}</p>
   <p class="small"><b>Image Prompt:</b><br>${escapeHTML(s.prompt)}</p>
  </div>
 `).join("");

 document.getElementById("result").style.display="block";
 document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function copyPrompts(){
 if(!prompts.length)return;
 const text=prompts.join("\n\n");
 if(navigator.clipboard){
  navigator.clipboard.writeText(text)
   .then(()=>alert("Image prompts copied!"))
   .catch(()=>alert("Copy नहीं हो पाया।"));
 }else{
  alert(text);
 }
}
</script>
</body>
</html>
